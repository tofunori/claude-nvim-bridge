# ------------------------------------------------------------------------------
# tmux statusbar configuration for claude-nvim-bridge
# Add this to your ~/.tmux.conf
# ------------------------------------------------------------------------------

# Dark statusbar with centered selection display
set -g status-style 'bg=#1a1a1a fg=#888888'
set -g status-justify centre
set -g status-left-length 60
set -g status-right-length 100
set -g status-left '#[fg=#5f875f][#S] '
set -g status-right '#[fg=#5f875f]%H:%M'

# Display selection in center (replaces window list)
set -g window-status-current-format '#(~/.claude/hooks/tmux-selection.sh)'
set -g window-status-format ''

# Update every second for real-time display
set -g status-interval 1

# ------------------------------------------------------------------------------
# Alternative: Keep window list, show selection on the right
# Uncomment below and comment out the section above
# ------------------------------------------------------------------------------
# set -g status-right '#(~/.claude/hooks/tmux-selection.sh) | #[fg=#5f875f]%H:%M'
# set -g status-right-length 120
